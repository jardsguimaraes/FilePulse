spring:
    application:
        name: filepulse

    datasource:
        url: jdbc:postgresql://localhost:5432/filepulse
        # jdbc-url: jdbc:postgresql://localhost:5432/filepulse
        username: "${POSTGRES_USERNAME}"
        password: "${POSTGRES_PASSWORD}"
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update

    batch:
        jdbc:
            initialize-schema: always
        job:
            enabled: false

    flyway:
        enabled: true
        baseline-on-migrate: true
        baseline-version: 0

fileprocessor:
    directory:
        diretorio-entrada: ./files/entrada
        diretorio-processamento: ./files/processamento
        diretorio-processados: ./files/processados
        diretorio-erro: ./files/erro
        diretorio-rejeitados: ./files/rejeitados
    stability:
        stable-checks: 3
        max-attempts: 10
        check-interval-ms: 1000
        max-retries: 3
        retry-interval-ms: 5000
    recovery:
        abandoned-after-minutes: 30
